<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Spinal Motion Series: five Gyrotonic movements to practice at home, with energy lines to follow.">
<title>The Spinal Motion Series · Gyrotonic at Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Outfit:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#EDE8DF; --surface:#F8F5F0;
    --ink:#20211C; --ink2:#43443C; --muted:#615F55;
    --hair:#D9D2C5; --sage:#5E6B4F; --sage-hover:#8C9779;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--ground);color:var(--ink);
    font-family:'Outfit',system-ui,sans-serif;font-weight:400;
    font-size:16.5px;line-height:1.72;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .label{
    font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
  }
  header{max-width:1080px;margin:0 auto;padding:96px 32px 40px}
  header h1{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(44px,7vw,76px);line-height:1.05;margin:18px 0 22px;
  }
  header .lede{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(22px,2.6vw,28px);line-height:1.4;color:var(--ink2);max-width:640px;
  }
  nav{
    max-width:1080px;margin:0 auto;padding:0 32px 72px;
    display:flex;flex-wrap:wrap;gap:10px;
  }
  nav a{
    border:1px solid var(--hair);border-radius:2px;padding:6px 12px;
    font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink2);
    transition:color .2s,border-color .2s;
  }
  nav a:hover{color:var(--sage);border-color:var(--sage-hover)}
  section.move{
    max-width:1080px;margin:0 auto;padding:64px 32px;
    border-top:1px solid var(--hair);
    display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:72px;align-items:start;
  }
  .stage{position:relative;width:100%;aspect-ratio:9/16;cursor:pointer}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .stage .toggle{
    position:absolute;right:12px;bottom:12px;
    font-size:11px;text-transform:uppercase;letter-spacing:.11em;
    background:rgba(248,245,240,.88);color:var(--ink2);
    border:1px solid var(--hair);border-radius:2px;padding:4px 9px;
  }
  .info{padding-top:12px;max-width:520px}
  .num{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:22px;color:var(--sage);
  }
  .info h2{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(36px,4.6vw,54px);line-height:1.08;margin:6px 0 20px;
  }
  .info p{color:var(--ink2);margin-bottom:14px}
  .meta{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    border:1px solid var(--hair);border-radius:2px;padding:3px 10px;
    font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);
  }
  .counter{margin-top:34px;padding-top:20px;border-top:1px solid var(--hair)}
  .counter .phase{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:26px;line-height:1.2;min-height:32px;color:var(--ink);
  }
  footer{
    max-width:1080px;margin:0 auto;padding:56px 32px 96px;border-top:1px solid var(--hair);
    color:var(--muted);font-size:14px;
  }
  /* arrows */
  .halo{stroke:var(--surface);stroke-opacity:.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .line{stroke:var(--sage);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .head-halo{fill:var(--surface);fill-opacity:.9;stroke:var(--surface);stroke-width:5;stroke-linejoin:round}
  .head{fill:var(--sage)}
  @media (max-width:820px){
    header{padding-top:64px}
    section.move{grid-template-columns:1fr;gap:28px;padding:48px 24px}
    .stage{max-width:340px}
    header,nav,footer{padding-left:24px;padding-right:24px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="label">Gyrotonic · Practice at home</div>
  <h1>The Spinal Motion Series</h1>
  <p class="lede">Five movements that expand the energy and mobility of the spine, each one beginning from a narrowing and lengthening to make more space in the body.</p>
</header>

<nav id="nav"></nav>

<main id="main"></main>

<footer>Videos play silently and loop. Tap a video to pause or resume.</footer>

<script>
const RATE = 0.85;   // playback speed: a little slower than recorded

/* Arrow coordinates live in a 360 x 640 space that matches the 9:16 video.
   Plain arrow:  {d, s, e, hold}   draws between s and e (video seconds), fades after e+hold.
   Morphing arrow: {shape(t), s, e, hold}  a spine line whose 5 points (sacrum, low, mid, upper, head) bend over time. */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const ease=u=>u*u*(3-2*u);

// one continuous arrow up the spine = narrowing
// up arrows run along the centre line of the body in each clip
const UP_BACK   ='M 246 432 C 242 340 232 250 200 140';   // narrowing: right along the spine, seen from the side
const UP_FRONT  ='M 197 450 L 197 118';   // side arch (seen from the front)
const UP_SPIRAL ='M 195 450 L 195 130';   // spirals: straight up and down
const up=(t0,t1,hold=0.3,d=UP_BACK)=>({d, s:t0, e:t1, hold});
const LEGS={d:'M 36 580 C 80 530 110 490 150 450', s:0, e:1.1, hold:1.8};

function shapeAt(t,K0,segs){
  let pts=K0.map(p=>[p[0],p[1]]);
  for(const sg of segs){
    if(t<sg.t0) break;
    pts=sg.from.map((p,i)=>{
      const u=ease(clamp((t-(sg.t0+sg.order[i]*sg.gap))/sg.dur,0,1));
      return [p[0]+(sg.to[i][0]-p[0])*u, p[1]+(sg.to[i][1]-p[1])*u];
    });
  }
  return pts;
}
const SAME=[0,0,0,0,0], CASCADE=[0,1,2,3,4];
function seg(from,to,t0,dur,order=SAME,gap=0){return {from,to,t0,dur,order,gap}}

// arch & curl
const AC_STRAIGHT=[[246,432],[241,370],[231,300],[217,220],[202,140]];
const AC_ARCH    =[[246,432],[200,385],[180,300],[190,215],[200,140]];
const AC_CURL    =[[246,432],[262,385],[272,300],[258,215],[218,150]];
const acSegs=[
  seg(AC_STRAIGHT,AC_ARCH,    2.4,2.4),
  seg(AC_ARCH,AC_STRAIGHT,    6.3,1.8),
  seg(AC_STRAIGHT,AC_CURL,    9.2,2.6)
];

// waves: sacrum, low, mid, upper back, head
const W_STRAIGHT=[[218,430],[211,370],[203,310],[195,245],[185,165]];
const W_FOLD    =[[238,435],[255,385],[252,320],[195,268],[32,312]];
const wSegs=[
  seg(W_STRAIGHT,W_FOLD,3.0,1.4,CASCADE,0.4),
  seg(W_FOLD,W_STRAIGHT,8.3,2.4,CASCADE,0.7)
];

// wave levels (sacrum, low, mid, upper back, head) as horizontal arrows behind the back
const WY=[390,325,260,195,130];
const wave=(i,dir,s,e,fade)=>({d: dir==='fwd' ? `M 318 ${WY[i]} L 232 ${WY[i]}` : `M 232 ${WY[i]} L 318 ${WY[i]}`, s, e, hold:fade-e});

// spirals
const SPIRAL_A='M 140 460 C 265 440 265 365 140 345 C 265 325 265 250 140 230 C 235 215 235 180 185 150';
const SPIRAL_B='M 235 460 C 110 440 110 365 235 345 C 110 325 110 250 235 230 C 140 215 140 180 190 150';

const MOVES = [
  {
    id:'narrowing', num:'01', name:'Narrowing', file:'video/narrowing.mp4',
    desc:[
      'The foundation of the whole series. The legs feed into the spine, and the spine rises up, up, up through three counts. Then everything relaxes.',
      'Every other movement in the series begins here.'
    ],
    tags:['3 counts up','3 counts relax'],
    counts:[{s:0,e:3,label:'Lift: up, up, up'},{s:3,e:6,label:'Relax'}],
    arrows:[ LEGS, up(0.3,3.0,0.1) ]
  },
  {
    id:'arch-curl', num:'02', name:'Balanced Arch & Curl', file:'video/arch-curl.mp4',
    desc:[
      'Begin with narrowing, then make a C-shape arching through the back, and then a C-shape curling the back the other way.',
      'Keep it balanced: the top of the head stays over the top of the sacrum, and each C is the same size in both directions.'
    ],
    tags:['4 repetitions each direction'],
    counts:[
      {s:0,e:2.2,label:'Narrowing'},{s:2.2,e:6.3,label:'Arch'},
      {s:6.3,e:8.8,label:'Straight spine'},{s:8.8,e:13.6,label:'Curl'}
    ],
    arrows:[
      {shape:t=>shapeAt(t,AC_STRAIGHT,acSegs), s:0.1, e:2.1, hold:11.2}
    ]
  },
  {
    id:'side-arch', num:'03', name:'Side Arch', file:'video/side-arch.mp4',
    desc:[
      'Begin with narrowing, then lift upward and arch over to one side, like an archway: up and over.',
      'Return through the centre and arch up and over to the other side.'
    ],
    tags:['4 repetitions each side'],
    counts:[
      {s:0,e:2.9,label:'Narrowing: lift up'},
      {s:2.9,e:8.7,label:'Up and over, first side'},
      {s:8.7,e:11.2,label:'Lift through the centre'},
      {s:11.2,e:21,label:'Up and over, second side'}
    ],
    arrows:[
      up(0.2,2.8,0.1,UP_FRONT),
      {d:'M 190 470 C 180 330 170 130 210 70 C 250 25 320 60 335 190', s:2.9, e:5.0, hold:2.2},
      up(8.8,10.8,0.1,UP_FRONT),
      {d:'M 185 470 C 195 330 205 130 165 70 C 125 25 55 60 40 190', s:11.0, e:13.3, hold:2.2}
    ]
  },
  {
    id:'spirals', num:'04', name:'Spirals', file:'video/spirals.mp4',
    desc:[
      'Begin with narrowing, then spiral in one direction and then the other.',
      'The spiral starts with the hips, then the waist, ribs and shoulders, then the head, and finishes with the eyes in an upward rotation.'
    ],
    tags:['4 repetitions each direction'],
    counts:[
      {s:0,e:1.2,label:'Narrowing'},{s:1.2,e:9,label:'Spiral, first direction'},
      {s:9,e:12.5,label:'Return'},{s:12.5,e:15.2,label:'Lift'},
      {s:15.2,e:24,label:'Spiral, other direction'}
    ],
    arrows:[
      up(0.0,1.2,0.1,UP_SPIRAL),
      {d:SPIRAL_B, s:1.2, e:6.2, hold:1.4},
      up(12.4,14.8,0.1,UP_SPIRAL),
      {d:SPIRAL_A, s:15.2, e:21.0, hold:1.4}
    ]
  },
  {
    id:'waves', num:'05', name:'Waves', file:'video/waves.mp4',
    desc:[
      'Begin with narrowing and lift up into a long, straight spine. Then the spine arches forward as a wave, segment by segment, starting from the base of the spine: sacrum, low, mid, upper back, and finally the head.',
      'Then it curls back the same way, from the sacrum to the head, until you arrive in a straight line again.'
    ],
    tags:['8 waves'],
    counts:[
      {s:0,e:1.6,label:'Narrowing, straight spine'},
      {s:1.6,e:6.4,label:'Arch forward, sacrum to head'},
      {s:6.4,e:11.6,label:'Curl back, sacrum to head'},
      {s:11.6,e:19,label:'Straight spine'}
    ],
    arrows:[
      {d:'M 205 450 L 205 130', s:0.1, e:1.5, hold:0.1},
      ...[0,1,2,3,4].map(i=>wave(i,'fwd',1.6+0.6*i,2.1+0.6*i,6.2)),
      ...[0,1,2,3,4].map(i=>wave(i,'back',6.4+0.6*i,6.9+0.6*i,11.5)),
      {d:'M 205 450 L 205 130', s:11.6, e:13.6, hold:3.0}
    ]
  }
];

const SVGNS='http://www.w3.org/2000/svg';
const main=document.getElementById('main'), nav=document.getElementById('nav');
const HEAD_PTS='2,0 -11,-7 -11,7';

function headXform(path,len){
  const end=path.getPointAtLength(len), back=path.getPointAtLength(Math.max(0,len-6));
  const ang=Math.atan2(end.y-back.y,end.x-back.x)*180/Math.PI;
  return `translate(${end.x} ${end.y}) rotate(${ang})`;
}
// smooth curve through points (Catmull-Rom -> Bezier); also returns end tangent
function curveThrough(pts){
  let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`, cp2=pts[0];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    cp2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${cp2[0].toFixed(1)} ${cp2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const end=pts[pts.length-1];
  const ang=Math.atan2(end[1]-cp2[1],end[0]-cp2[0])*180/Math.PI;
  return {d, xf:`translate(${end[0].toFixed(1)} ${end[1].toFixed(1)}) rotate(${ang.toFixed(1)})`};
}

MOVES.forEach(m=>{
  const a=document.createElement('a'); a.href='#'+m.id; a.textContent=m.num+'  '+m.name; nav.appendChild(a);

  const sec=document.createElement('section'); sec.className='move'; sec.id=m.id;
  sec.innerHTML=`
    <div class="stage">
      <video muted playsinline loop preload="metadata" aria-label="${m.name}" src="${m.file}"></video>
      <svg viewBox="0 0 360 640" aria-hidden="true"></svg>
      <span class="toggle">Pause</span>
    </div>
    <div class="info">
      <div class="num">${m.num}</div>
      <h2>${m.name}</h2>
      ${m.desc.map(t=>`<p>${t}</p>`).join('')}
      <div class="meta">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="counter"><div class="phase">&nbsp;</div></div>
    </div>`;
  main.appendChild(sec);

  const video=sec.querySelector('video'), svg=sec.querySelector('svg');
  const phaseEl=sec.querySelector('.phase'), toggle=sec.querySelector('.toggle');
  video.muted=true; video.defaultMuted=true; video.playbackRate=RATE; video.defaultPlaybackRate=RATE;
  video.addEventListener('loadedmetadata',()=>{video.playbackRate=RATE});
  video.addEventListener('play',()=>{video.playbackRate=RATE});

  const items=m.arrows.map(ar=>{
    const g=document.createElementNS(SVGNS,'g'); g.style.opacity=0;
    const mk=(cls,w)=>{const p=document.createElementNS(SVGNS,'path');p.setAttribute('class',cls);p.setAttribute('stroke-width',w);p.setAttribute('pathLength','1');p.style.strokeDasharray='1 1';return p};
    const halo=mk('halo',9), line=mk('line',3.4);
    const hh=document.createElementNS(SVGNS,'polygon'); hh.setAttribute('points',HEAD_PTS); hh.setAttribute('class','head-halo');
    const hd=document.createElementNS(SVGNS,'polygon'); hd.setAttribute('points',HEAD_PTS); hd.setAttribute('class','head');
    g.append(halo,line,hh,hd); svg.appendChild(g);
    if(ar.d){
      halo.setAttribute('d',ar.d); line.setAttribute('d',ar.d);
      const raw=document.createElementNS(SVGNS,'path'); raw.setAttribute('d',ar.d); svg.appendChild(raw);
      const T=headXform(raw,raw.getTotalLength()); svg.removeChild(raw);
      hh.setAttribute('transform',T); hd.setAttribute('transform',T);
    }
    return {ar,g,halo,line,hh,hd};
  });

  function render(){
    const t=video.currentTime;
    items.forEach(({ar,g,halo,line,hh,hd})=>{
      if(ar.shape){
        const c=curveThrough(ar.shape(t));
        halo.setAttribute('d',c.d); line.setAttribute('d',c.d);
        hh.setAttribute('transform',c.xf); hd.setAttribute('transform',c.xf);
      }
      const p=clamp((t-ar.s)/(ar.e-ar.s),0,1);
      halo.style.strokeDashoffset=1-p; line.style.strokeDashoffset=1-p;
      hh.style.opacity=hd.style.opacity=(p>=0.995)?1:0;
      let op=0;
      if(t>=ar.s){ op=1; const f=ar.e+ar.hold; if(t>f) op=clamp(1-(t-f)/0.5,0,1); }
      g.style.opacity=op;
    });
    let cur=null; for(const c of m.counts){ if(t>=c.s && t<c.e){cur=c;break} }
    phaseEl.innerHTML=cur?cur.label:'&nbsp;';
  }
  function loop(){render(); requestAnimationFrame(loop)}
  video.addEventListener('timeupdate',render);
  video.addEventListener('seeked',render);
  requestAnimationFrame(loop);

  let userPaused=false;
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting && !userPaused){ video.play().catch(()=>{}) }
      else if(!e.isIntersecting){ video.pause() }
    });
  },{threshold:0.45});
  io.observe(video);
  sec.querySelector('.stage').addEventListener('click',()=>{
    if(video.paused){userPaused=false;video.play().catch(()=>{});}
    else{userPaused=true;video.pause();}
  });
  video.addEventListener('play',()=>toggle.textContent='Pause');
  video.addEventListener('pause',()=>toggle.textContent='Play');
});
</script>
</body>
</html>
