  - slug: lost-time
    title: Lost Time
    year: 2023
    kind: Dance film
    role: Choreography and direction
    venue: The Odyssey Theatre
    place: Los Angeles
    when: July 2023
    summary: >-
      A short dance film made in Los Angeles in the summer of 2023, shown at The Odyssey Theatre.
    quote:
      text: >-
        Missing! Desperate to find lost time. Afraid it will never be found again. Lost yesterday
        or tomorrow, but could've been today. Changes depending on who is looking at it and where
        it's being looked at. Stands still for no man and flies when you're having fun. Loves to
        bother white rabbits. Priceless. If found, please contact right away. Not a moment to spare.
      cite: "From the film's notice"
