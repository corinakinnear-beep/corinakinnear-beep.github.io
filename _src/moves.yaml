  - slug: naked
    title: "NAKED: An Art Happening"
    year: 2018
    kind: Production — 17 performances
    role: Direction and choreography
    venue: Odyssey Theatre Dance Festival · Pico Union Project
    place: Los Angeles
    when: February–March 2018
    summary: >-
      How are we supposed to look? NAKED was an evening of art about nakedness — what it means to
      see a body, and what we bring to the looking. At its centre is a thirty-minute contemporary
      dance for five dancers of different sexes, races and ages, from 23 to 73, performed entirely
      nude: a way of exploring non-sexualised nudity and of letting each audience member meet it
      through their own life, without being told what to expect.
    body:
      - >-
        Around the dance, the evening moved through four parts. In naked art, guests entered a
        space transformed by Gina Teichert's installation, with illustrations by C. W. Moss and
        photography by Lilly Lawrence and by Andrew Grace (Second Mirror). Then came naked dance,
        to an original score by SILENTSHOUT. In naked talk, on the upstairs balcony, Corina asked
        the audience about their own perceptions of and experiences with nakedness. And each
        night closed with naked music: a stripped-down, unplugged set by a different Los Angeles
        indie band.
      - >-
        The dance premiered at the Odyssey Theatre Dance Festival on 8 and 9 February 2018. The
        full happening then ran for fifteen nights at the Pico Union Project, a former synagogue
        in downtown Los Angeles, from 22 February to 25 March 2018. Five dancers performed each
        night, drawn from a company of eight.
    quotes:
      - { text: "The sweat soon glistens in the light and the five different skin tones become clearer.", cite: "Jeff Slayton, LA Dance Chronicle, 1 March 2018", url: "http://www.ladancechronicle.com/corina-kinnear-presents-naked-at-pico-union-project-a-review/" }
      - { text: "Their answers were honest and occasionally humorous.", cite: "Jeff Slayton on naked talk, LA Dance Chronicle", url: "http://www.ladancechronicle.com/corina-kinnear-presents-naked-at-pico-union-project-a-review/" }
    credits:
      - [Direction and choreography, Corina Kinnear]
      - [Produced with, "John Lambremont, who booked the bands"]
      - [Dancers, "Amanda Masongsong, Khristina Cayetano, Sean Greene, Keon Saghari, Ryan Ruiz, Amanda “M.C.” MacLeod, Louie Cornejo, Roger Gonzalez Hibner"]
      - [Original score, "SILENTSHOUT (Alina Cutrono and Theo Karon)"]
