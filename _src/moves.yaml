teaching:
  intro: >-
    Classical and contemporary technique, master classes, conventions and choreography for
    studios and companies — with the intention of combining artistic exploration with technical
    development, so that dancers leave as well-rounded, expressive artists.
  body:
    - >-
      Corina grew up teaching and choreographing at her mother's studio, Parker Dance Academy in
      Colorado. After her BFA with Alonzo King's LINES Ballet she began teaching professional
      classes at The Edge Performing Arts Center in Hollywood and company class for ensembles
      including the Deutsche Oper Berlin and Invertigo Dance Theatre, and now teaches
      internationally in workshops and intensives.
