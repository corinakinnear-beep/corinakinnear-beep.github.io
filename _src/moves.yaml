  - slug: naked
    title: "NAKED: An Art Happening"
    year: 2018
    kind: Production — 17 performances
    role: Direction and choreography
    venue: Odyssey Dance Festival · Pico Union Project
    place: Los Angeles
    when: February–March 2018
    summary: >-
      How are we supposed to look? NAKED premiered at the Odyssey Dance Festival on 8 and 9
      February 2018 and ran for fifteen further evenings at the Pico Union Project in downtown
      Los Angeles. At its centre is a thirty-minute contemporary dance for five performers of
      differing sexes, races and ages — from 23 to 73 — performed entirely in the nude, as a way
      of looking at non-sexualised nakedness.
    body:
      - >-
        Each evening was built as a happening in four parts: an exhibition of work by guest
        artists at eight, the dance at half past, then an experiment in which the audience was
        asked about its own perceptions and experience of nakedness, and finally a stripped-down,
        unplugged set by a different Los Angeles band.
      - >-
        Guest artists included the visual artist Gina Teichert, the illustrator C.W. Moss, the
        photographer Lilly Lawrence, the sound artists SILENTSHOUT and, in the photography exhibit
        Second Mirror, Andrew Grace. The bands included Whispertown, The Mynabirds, The Love
        Language, Russian Red and BLONDFIRE.
    credits:
      - [Direction and choreography, Corina Kinnear]
      - [Performers, "Amanda Masongsong, Khristina Cayetano, Sean Greene, Keon Saghari, Ryan Ruiz, Amanda “M.C.” MacLeod, Louie Cornejo, Roger Gonzalez Hibner"]
      - [Original score, "SILENTSHOUT (Alina Cutrono and Theo Karon)"]
      - [Dramaturgy, Laura Karlin]
      - [Lighting design, Bosco Flanagan]
      - [Company class, Andrew Pearson]
      - [Artistic development, Stephanie Baer]
      - [Photography, "Lilly Lawrence, Saskia Keeley"]
      - [Rehearsal space, The Post House]
      - [Premiere, "Odyssey Dance Festival, 8–9 February 2018; then Pico Union Project, 22 February – 25 March 2018"]
    photo_credit: "Photographs by Saskia Keeley (top) and Lilly Lawrence"
    video:
      kind: vimeo
      id: "250096790"
      caption: "naked. an art happening — the promotional film (FOXFLY, 2018)"
    images:
      - { file: saskia-keeley-stage.jpg, alt: "The company bent forward on a dark wooden floor, stained-glass windows behind", pos: "50% 55%" }
      - { file: naked-press-photo-by-lilly-lawrence-2.jpg, alt: "Performers lying back against a pale wall, legs raised" }
