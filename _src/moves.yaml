    - { name: "Fluid Dance Conventions", detail: "Faculty" }
    - { name: "CLI Studios", detail: "Online classes, 2020" }
    - { name: "Company class", detail: "Deutsche Oper Berlin, Invertigo Dance Theatre" }
    - { name: "Workshops and private coaching", detail: "Los Angeles, Berlin, Paris and by arrangement" }
  cta: "Enquire about a class, workshop or intensive"
