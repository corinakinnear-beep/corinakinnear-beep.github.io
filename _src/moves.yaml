# Source of truth for the Parla Moves pages (dance). scripts/site.py turns this into HTML.
# Images: file names relative to /moves/img/<slug>/ ; add them as they are chosen.
# Anything marked "confirm" in notes is a question for Cori, not shown on the site.

site:
  moves_tagline: "choreography, direction and performance."
  moves_intro: >-
    Dance work by Corina Kinnear — productions, films and commissions made under the name
    Parlā, alongside twenty years of performing for companies and choreographers in Los Angeles,
    Berlin, San Francisco, Montreal and New York.
  instagram: "https://www.instagram.com/parlamoves/"
  instagram_handle: "@parlamoves"
  contact_email: "corina.kinnear@gmail.com"
  sections:
    - { key: stage, title: Stage, intro: "Productions, festival works and films." }
    - { key: events, title: Events, intro: "Immersive work made for galas, conferences and gatherings — for the room, the hour and the people in it." }

