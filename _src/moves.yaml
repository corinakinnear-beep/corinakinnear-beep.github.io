bio:
  lede: "Choreographer, director and dancer. Founder of Parlā."
  paragraphs:
    - >-
      Corina Kinnear makes dances, films and happenings that take the details of ordinary life —
      time, nakedness, a crowded room, the sea — and give an audience a way to look at them again.
      Her productions have ranged from MOVMT, an immersive evening for ten dancers at MiMoDa
      Studio in Los Angeles, to NAKED: An Art Happening, seventeen performances built around a
      nude company of five and a nightly conversation with the audience, to Ocean 12 on the beach
      at Santa Monica and the dance film Lost Time. Her newest work, Temps Oublié, was developed
      in residency at the Centre national de la danse in Paris in 2025; Objects in Mirror Are
      Closer Than They Appear premiered at the Los Angeles Dance Festival in 2026.
    - >-
      She trained at Parker Dance Academy, her mother's studio in Colorado, and at International
      Ballet School, and holds a BFA from Dominican University of California with Alonzo King's
      LINES Ballet. As a performer she has danced with the Deutsche Oper Berlin, Los Angeles
      Opera, Invertigo Dance Theatre, Alonzo King LINES Ballet and the Deutsches Fernsehballett,
      and for choreographers including Aszure Barton, Sarah Elgart, Mike Tyus and Laura Karlin,
      with creative residencies at PARTS in Brussels, CND in Paris and TanzFabrik in Berlin.
    - >-
      Parlā is her company and the name under which she directs, choreographs and teaches,
      between Los Angeles, Berlin and Paris. She also designs spaces — the same attention to how
      a body moves through a room, applied to the room itself.
  training:
    - "BFA, Dominican University of California with Alonzo King's LINES Ballet (2011) — Alonzo King, Marina Hotchkiss, Arturo Fernandez, Maurya Kerr, Yannis Adoniou, Gregory Dawson, Kara Davis"
    - "International Ballet School (2000–2007) — German Zamuel, Mark Carlson, Sandra Carlson"
    - "Parker Dance Academy (1991–2007) — ballet, pointe, tap, jazz, hip-hop, contemporary"
    - "Intensives: Springboard Danse Montréal, Steps on Broadway, Hubbard Street Dance Chicago, Cleo Parker Robinson Dance, The Edge, Ballet West, Pacific Northwest Ballet School"
  residencies:
    - "PARTS, Brussels · CND, Paris · TanzFabrik, Berlin · The Post House / Bella Lewitzky Residency, Los Angeles · MAD Art, Seattle"
  headshot: b9951026.jpg
  headshot_credit: "Photograph by Rory"
  notes: "bio newly written from the 2025 CV, the 2019 teaching bio and the 2018 artist statement — Cori to approve; headshot by Rory (May 2026) — surname wanted for the credit"
