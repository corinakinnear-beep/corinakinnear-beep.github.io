  - slug: nell-ombra
    section: events
    title: "Nell'ombra"
    subtitle: A dance opera in a Venetian palazzo
    year: 2017
    kind: Dance opera
    role: Concept, choreography and direction
    venue: Palazzo Pisani Moretta
    place: Venice
    when: January 2017
    summary: >-
      A four-hour dance opera for a gala evening in Palazzo Pisani Moretta, on the Grand Canal in
      Venice. The performers were the people of the walls — the palazzo's own residents come to
      life — appearing and disappearing in candlelight, shadow and reflection, so that no guest
      could be sure who was performing and who might be a mannequin.
    body:
      - >-
        In the candlelit entrance hall the characters stood as still as statues, then turned, or
        asked a passing guest for a glass of wine. Upstairs, eight rooms held eight different
        stories, so each guest saw a different show. A soprano and a castrato threaded arias through
        the night, and the whole evening drew on Venice itself: water, light and shadow, masks and
        mirrors, commedia dell'arte and Baroque opera — what is real, and what is not.
      - >-
        Each dancer built a character with Corina in the weeks before, and Tereza Kopecká designed
        their costumes as a contemporary spin on the Baroque — a theatrical recreation, not a
        reproduction. On a second evening the same characters hosted a masked ball to a Venetian
        quartet in period costume, handing out masks and teaching Baroque dances until every dancer
        had a guest for a partner.
    characters_intro: >-
      From Corina's notes to the company, January 2017 — a starting point, not a script.
    characters:
      - { name: Miguel, performer: "Miguel Ángel Collado Sánchez", text: "Living a life of contradiction and wandering without fear of consequence. No connection to the future, just the now. Inspired by the feeling of Don Juan." }
      - { name: Yuri, performer: "Yuri Shimaoka", text: "Magical, mischievous and adventurous, with a purity and innocence. Inspired by Amélie, Juliet, Chloé in Mood Indigo and Laura in Paterson." }
      - { name: Wanderson, performer: "Wanderson Wanderley", text: "Playful and testing boundaries, but also light-hearted. Pretending to get drunk as the night goes on, a reminder of joy and ease." }
      - { name: Cora, performer: "Coraline Arnaud", text: "Sophisticated and almost arrogant, but it is a cover for an obsessive personality. She carries a deck of Italian cards, and the tasks surrounding them are enormously meaningful to her." }
      - { name: Laura, performer: "Laura Karlin", text: "Formal and elegant, yet incredibly sensual and attracted to sensation. She wants a partner, and dances with the guests." }
      - { name: Rachael, performer: "Rachael Elliott", text: "Comic and immature in a playful spirit, but in moments lost in dark nostalgia. Inspired by the films of Tim Burton." }
      - { name: Susanne, performer: "Susanne Eder", text: "Feminine, with odd interests and obsessions. Unable to communicate with words — only with a kind of sign language, or pantomime." }
      - { name: Ryan, performer: "Ryan Walker Page", text: "A castrato opera singer, with explosive outbursts of emotion and the mannerisms of a diva." }
      - { name: Sarah, performer: "Sarah Toth", text: "An actual opera singer: moments of bravado with enormous character, and private backstage moments that are very honest." }
    quote:
      text: "It seems they were very convinced we were indeed people of the walls. Many asked which opera we were performing."
      cite: "Corina Kinnear, after the evening"
    credits:
      - ["Concept, choreography and direction", Corina Kinnear]
      - [Performers, "Miguel Ángel Collado Sánchez, Yuri Shimaoka, Wanderson Wanderley, Coraline Arnaud, Laura Karlin, Rachael Elliott, Susanne Eder, Ryan Walker Page"]
      - [Soprano, Sarah Toth]
      - [Costume design, Tereza Kopecká]
      - [Producer, Nicola Davis]
      - [Photography and film, Arno]
      - [Performed, "Palazzo Pisani Moretta, Venice — 24 and 26 January 2017"]
    photo_credit: "Photographs by Arno, Venice, January 2017"
    images:
      - { file: venice0117-702.jpg, alt: "The company in costume on a canal-side step in Venice, striped mooring poles behind", pos: "50% 38%" }
      - { file: venice0117-304.jpg, alt: "A dancer in white lace and long black gloves on a balcony above the rooftops" }
      - { file: venice0117-550.jpg, alt: "A dancer in a ruff and tulle reclining on a gilded sofa beneath red damask" }
      - { file: venice0117-469.jpg, alt: "A dancer in a silver bodice and tiered tulle by a pale green canal" }
      - { file: venice0117-582.jpg, alt: "A dancer in a black ruff and white face paint, mid-step in a narrow alley" }
      - { file: venice0117-489.jpg, alt: "Close portrait, arms raised over the head, silver bodice" }
    notes: "commissioned for a corporate gala (client not named on the site, by design); title Nell'ombra confirmed by Cori (correct Italian: in + la ombra → nell'ombra; the CV says 'Nella Ombra'); four hours confirmed; surnames for Arno etc. not available. Photos: the 6 by Arno in Dropbox /parlā/Venice Videos Arno/Photos (Venice011.jpg in Audition Materials is a smaller copy of 702). 46 clips by Arno not yet used — a short film excerpt is possible later."

  - slug: welcome-to-berlin
    section: events
    title: Welcome to Berlin
    subtitle: An opening, a flash mob, a cabaret and a human bridge
    year: 2016
    kind: Event commissions
    role: Concept, choreography and direction
    venue: Berlin
    place: Berlin
    when: January and May 2016
    summary: >-
      Three pieces for an international gathering of three hundred delegates in Berlin in January
      2016, and a fourth in May — each made for the room, the hour and the people in it.
    body:
      - >-
        Welcome to Berlin opened the meeting: three minutes of contemporary dance about pushing
        towards the future, danced in front of a screen that wrapped around the hall, in costumes by
        Tereza Kopecká threaded with LED lights. It ended with a sweep of fabric revealing the first
        speaker, and the words “Welcome to Berlin”.
      - >-
        The next morning a flash mob broke out at breakfast — ten dancers in their own clothes,
        joined by delegates who had learned the steps from Corina's tutorial film, to a mix by John
        Lambremont Jr. At the end of the week came a Great Gatsby cabaret at the Adagio club: a
        high-energy Charleston with a live band, then four very individual dancers and an MC, each a
        character in a costume made for them — twenties curls, feather fans, long gloves — and
        fire-eating by Coraline Arnaud.
      - >-
        In May, Corina returned with a human bridge for 156 people: six teams of twenty-six, each with
        a coach, carrying a walker across a bridge made of their own bodies, after a safety film she
        scripted and shot.
    quote:
      text: "Your work and the work of your dancers was wonderful."
      cite: "Glyn Davies, February 2016"
