  - slug: forgotten-time
    title: Forgotten Time
    subtitle: Temps oublié — a work in progress
    year: 2025
    kind: Work in progress
    role: Concept, choreography and direction
    venue: Odyssey Theatre
    place: Los Angeles
    when: June–July 2025
    summary: >-
      A work in progress about time and how we remember it — made in Paris in June 2025 during a
      creation residency at the Centre national de la danse, then shown at the Odyssey Theatre in
      Los Angeles on 6 July 2025, closing the summer edition of Dance at the Odyssey.
    body:
      - >-
        Forgotten Time continues the research Corina began with Lost Time: how we perceive time,
        and what becomes of it in memory. Its subject is the moments we forget, big and small —
        sometimes painful, sometimes beautiful — and it draws on dance theatre so that the audience
        sees each dancer as a person, moving, feeling and dancing.
      - >-
        Four dancers who made the piece in Paris travelled to Los Angeles, where dancers from the
        city joined them for four days of rehearsal before the show. The company danced in their
        own earth-toned clothes, socks and tennis shoes, with beige trench coats, to an original
        score by M. Bronx. The evening was a shared bill with Jordan Saenz's duet The Shadow Poems.
    quote:
      text: "Our forgotten moments, big and small. Sometimes painful, sometimes beautiful."
      cite: "Corina Kinnear, inviting dancers into the work, May 2025"
    credits:
      - ["Concept, choreography and direction", Corina Kinnear]
      - [Dancers, "Lola Arnaud, Steph Baer, Stephanie Dai, Ann Glaviano, Yoko Hasebe, Magnolia Machado, Maiko Okajima, Matthew Van Oss, Sadie Yarrington"]
      - [Original music, M. Bronx]
      - [Filmed by, Josh Rose]
      - [Residency, "Centre national de la danse (CND), Pantin — June 2025"]
      - [Shown, "Odyssey Theatre, Los Angeles — 6 July 2025, Dance at the Odyssey"]
    press:
      - { date: "1 July 2025", outlet: "LA Dance Chronicle", what: "preview by Ann Haskins in “Festive Finales”", url: "https://www.ladancechronicle.com/festive-finales/" }
    images: []
    notes: "from Cori's emails (invitation 31 May 2025, logistics 29 Jun, credits sent to LA Dance Chronicle 10 Jul) and the CND attestation. CONFIRM: residency month (program says June; the Oct 2025 attestation says May at CND with the showing and captation in June); spelling Matthew Van Oss (attestation) vs 'Mathew Van Os' (her email); Sadie vs Sarah Yarrington (Ocean12 cast list). Images: the tech-filming screenshots by Josh Rose were emailed to Jeff Slayton 10 Jul 2025 — not in Dropbox; ask Cori for them or for Josh's film. Jeff Slayton's review: not found online yet. Don't publish the phone number in the CND letter."

